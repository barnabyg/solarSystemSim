<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Simulator</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060f;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .label-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .body-label {
        position: absolute;
        left: 0;
        top: 0;
        color: #dfe7ff;
        font: 500 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        user-select: none;
        pointer-events: auto;
        cursor: pointer;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.9),
          0 0 8px rgba(0, 0, 0, 0.6);
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 92px;
        transform: translateX(-50%);
        color: #cdd8ff;
        font: 500 13px/1.4 system-ui, sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(8, 12, 28, 0.72);
        border: 1px solid rgba(140, 165, 255, 0.25);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        user-select: none;
        pointer-events: none;
      }
      /* Corner sim-date readout (ticket #6): advances with time warp. */
      #sim-date {
        position: absolute;
        top: 14px;
        right: 16px;
        color: #cdd8ff;
        font: 500 13px/1.4 system-ui, sans-serif;
        letter-spacing: 0.06em;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(8, 12, 28, 0.72);
        border: 1px solid rgba(140, 165, 255, 0.25);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        user-select: none;
        z-index: 10;
      }
      /* Bottom-center controls (ticket #6 time controls + ticket #10 scale
         toggle + ticket #12 mute toggle): the wrapper centers the bar; the
         time controls keep their panel styling inside it. */
      #bottom-bar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 10;
      }
      #time-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-radius: 14px;
        background: rgba(8, 12, 28, 0.72);
        border: 1px solid rgba(140, 165, 255, 0.25);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        user-select: none;
      }
      #time-controls button {
        color: #dfe7ff;
        font: 500 12px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        background: rgba(140, 165, 255, 0.1);
        border: 1px solid rgba(140, 165, 255, 0.3);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      #time-controls button:hover {
        background: rgba(140, 165, 255, 0.2);
      }
      #time-controls button[aria-pressed="true"] {
        background: rgba(255, 180, 90, 0.22);
        border-color: rgba(255, 180, 90, 0.5);
      }
      #time-controls .preset-btn[aria-pressed="true"] {
        background: rgba(140, 165, 255, 0.28);
        border-color: rgba(140, 165, 255, 0.6);
      }
      /* Scale-mode toggle (ticket #10): sits beside the time controls; the
         amber pressed state marks true-scale mode. */
      #scale-toggle {
        color: #dfe7ff;
        font: 500 12px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
        background: rgba(140, 165, 255, 0.1);
        border: 1px solid rgba(140, 165, 255, 0.3);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      #scale-toggle:hover {
        background: rgba(140, 165, 255, 0.2);
      }
      #scale-toggle[aria-pressed="true"] {
        background: rgba(255, 180, 90, 0.22);
        border-color: rgba(255, 180, 90, 0.5);
      }
      #warp-slider {
        width: 180px;
        accent-color: #8ca5ff;
        cursor: pointer;
      }
      #warp-label {
        min-width: 56px;
        text-align: right;
        color: #cdd8ff;
        font: 500 12px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      /* Soundscape mute toggle (ticket #12): a compact speaker glyph; its
         aria-pressed state mirrors the soundscape's muted flag. */
      #mute-btn {
        min-width: 38px;
        font-size: 14px;
        line-height: 1;
        padding: 7px 9px;
      }
      /* The pressed (muted) state must beat the generic pressed-button rule
         in the panel, hence the repeated id. */
      #time-controls #mute-btn[aria-pressed="true"] {
        background: rgba(255, 130, 130, 0.18);
        border-color: rgba(255, 130, 130, 0.5);
      }
      /* Right-side fact card (ticket #9): opens on inspect, closes on
         click-away or Escape. */
      #fact-card {
        position: absolute;
        top: 60px;
        right: 16px;
        width: 300px;
        max-width: calc(100vw - 32px);
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(8, 12, 28, 0.86);
        border: 1px solid rgba(140, 165, 255, 0.25);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        color: #dfe7ff;
        font: 400 13px/1.5 system-ui, sans-serif;
        user-select: none;
        z-index: 20;
      }
      #fact-card[hidden] {
        display: none;
      }
      .fact-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      #fact-card-name {
        margin: 0;
        font: 600 18px/1.2 system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      #fact-card-close {
        color: #cdd8ff;
        font: 500 15px/1 system-ui, sans-serif;
        background: rgba(140, 165, 255, 0.1);
        border: 1px solid rgba(140, 165, 255, 0.3);
        border-radius: 8px;
        padding: 3px 9px;
        cursor: pointer;
      }
      #fact-card-close:hover {
        background: rgba(140, 165, 255, 0.2);
      }
      .fact-list {
        margin: 0;
      }
      .fact-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-bottom: 1px solid rgba(140, 165, 255, 0.12);
      }
      .fact-row dt {
        color: #9fb0e8;
        font-size: 12px;
        letter-spacing: 0.03em;
      }
      .fact-row dd {
        margin: 0;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .vs-earth {
        margin: 12px 0;
      }
      .vs-earth-title {
        display: block;
        color: #9fb0e8;
        font-size: 12px;
        letter-spacing: 0.03em;
        margin-bottom: 6px;
      }
      .vs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0;
      }
      .vs-row-name {
        width: 64px;
        flex: none;
        font-size: 12px;
        color: #cdd8ff;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vs-track {
        flex: 1;
        height: 10px;
        border-radius: 5px;
        background: rgba(140, 165, 255, 0.14);
        overflow: hidden;
      }
      .vs-fill {
        height: 100%;
        border-radius: 5px;
        max-width: 100%;
      }
      .vs-earth-fill {
        width: 64px;
        background: #6f82cf;
      }
      .vs-body-fill {
        min-width: 2px;
        background: #ffb45a;
      }
      .vs-earth-label {
        display: block;
        margin-top: 6px;
        color: #ffd9a8;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-align: right;
      }
      .fact-fun-fact {
        margin: 4px 0 0;
        padding-top: 10px;
        border-top: 1px solid rgba(140, 165, 255, 0.12);
        color: #cdd8ff;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">Drag to look around — scroll to zoom — click a planet</div>
    <div id="sim-date"></div>
    <div id="bottom-bar">
      <div id="time-controls">
        <button id="pause-btn" type="button" aria-pressed="false">Pause</button>
        <button type="button" class="preset-btn" data-warp-preset="1">1×</button>
        <button type="button" class="preset-btn" data-warp-preset="3600">1 h/s</button>
        <button type="button" class="preset-btn" data-warp-preset="86400">1 d/s</button>
        <button type="button" class="preset-btn" data-warp-preset="2629746">1 mo/s</button>
        <input id="warp-slider" type="range" min="0" max="1000" step="1" aria-label="Time warp" />
        <span id="warp-label">1 d/s</span>
        <button id="mute-btn" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
      </div>
      <!-- Ticket #10 scale toggle: flips between compressed and true-scale
           mode; the button label and aria-pressed mirror the current mode. -->
      <button id="scale-toggle" type="button" aria-pressed="false">Scale: Compressed</button>
    </div>
    <div id="boot-status" hidden></div>
    <div id="camera-state" hidden></div>
    <!-- Ticket #10 seam: the scale-toggle e2e test asserts the active scale
         mode from this element (compressed | true). -->
    <div id="scale-mode" hidden></div>
    <!-- Ticket #12 audio seam: the soundscape e2e spec asserts the context
         state and mute flag from this element (mirrored each frame in
         main.ts alongside window.__soundscape). -->
    <div id="audio-status" hidden></div>
    <!-- Ticket #8 roster seam: the full-roster smoke test asserts the scene's
         actual body count and belt particle count from this element. -->
    <div id="roster-status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
