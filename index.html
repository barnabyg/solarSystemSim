<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Simulator</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060f;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .label-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .body-label {
        position: absolute;
        left: 0;
        top: 0;
        color: #dfe7ff;
        font: 500 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        user-select: none;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.9),
          0 0 8px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-status" hidden></div>
    <div id="sim-date" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
